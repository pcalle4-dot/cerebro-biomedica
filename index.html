
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cerebro 3D Interactivo en RA</title>

  <!-- Librerías Three.js y AR.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #hud {
      position: fixed;
      top: 12px;
      width: 100%;
      z-index: 10;
      color: white;
      text-align: center;
      pointer-events: none;
      text-shadow: 0 1px 5px black;
    }

    #hud h1 { font-size: 19px; margin: 0; }
    #hud p { font-size: 13px; margin: 6px; }

    #status {
      position: fixed;
      bottom: 14px;
      width: 100%;
      color: white;
      text-align: center;
      z-index: 11;
      font-size: 12px;
      text-shadow: 0 1px 5px black;
    }
  </style>
</head>

<body>

<div id="hud">
  <h1>Cerebro 3D – Realidad Aumentada</h1>
  <p>Apunta tu cámara al marcador HIRO</p>
</div>

<div id="status">Iniciando realidad aumentada...</div>

<script>
(() => {

  const status = document.getElementById("status");

  if (!window.THREE || !window.THREEx) {
    status.textContent = "Error cargando las librerías 3D.";
    return;
  }

  // ESCENA Y CÁMARA

  const scene = new THREE.Scene();
  const camera = new THREE.Camera();

  scene.add(camera);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  renderer.domElement.style.position = "fixed";
  renderer.domElement.style.inset = "0";
  renderer.domElement.style.zIndex = "1";

  document.body.appendChild(renderer.domElement);

  // CONFIGURACIÓN AR

  const arSource = new THREEx.ArToolkitSource({
    sourceType: "webcam"
  });

  const arContext = new THREEx.ArToolkitContext({
    cameraParametersUrl:
      "https://raw.githack.com/AR-js-org/AR.js/3.4.7/data/camera_para.dat",
    detectionMode: "mono"
  });

  function resize() {
    arSource.onResizeElement();
    arSource.copyElementSizeTo(renderer.domElement);

    if (arContext.arController) {
      arSource.copyElementSizeTo(arContext.arController.canvas);
    }
  }

  arSource.init(() => {
    resize();
    status.textContent =
      "Cámara activa. Muestra el marcador HIRO.";
  }, () => {
    status.textContent =
      "No se pudo iniciar la cámara. Autoriza el acceso y usa HTTPS.";
  });

  window.addEventListener("resize", resize);

  arContext.init(() => {
    camera.projectionMatrix.copy(
      arContext.getProjectionMatrix()
    );
  });

  // MARCADOR HIRO

  const markerRoot = new THREE.Group();
  scene.add(markerRoot);

  new THREEx.ArMarkerControls(
    arContext,
    markerRoot,
    {
      type: "pattern",
      patternUrl:
        "https://raw.githack.com/AR-js-org/AR.js/3.4.7/data/hiro.patt"
    }
  );

  // ILUMINACIÓN

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));

  const directionalLight =
    new THREE.DirectionalLight(0xffffff, 0.9);

  directionalLight.position.set(2, 5, 3);
  scene.add(directionalLight);

  const pointLight =
    new THREE.PointLight(0xff6688, 0.35, 8);

  pointLight.position.set(-2, 1, 2);
  scene.add(pointLight);

  // GRUPO DEL CEREBRO

  const brainGroup = new THREE.Group();

  const brainMaterial =
    new THREE.MeshStandardMaterial({
      color: 0xeaa0ad,
      roughness: 0.48,
      metalness: 0.02,
      bumpScale: 0.035
    });

  // TEXTURA DE RELIEVE

  const canvas = document.createElement("canvas");
  canvas.width = 256;
  canvas.height = 256;

  const ctx = canvas.getContext("2d");
  const pixels = ctx.createImageData(256, 256);

  for (let y = 0; y < 256; y++) {
    for (let x = 0; x < 256; x++) {

      const value = Math.max(0, Math.min(255,
        128 +
        42 * Math.sin(x / 7) * Math.cos(y / 9) +
        18 * Math.sin((x + y) / 3)
      ));

      const index = (y * 256 + x) * 4;

      pixels.data[index] = value;
      pixels.data[index + 1] = value;
      pixels.data[index + 2] = value;
      pixels.data[index + 3] = 255;
    }
  }

  ctx.putImageData(pixels, 0, 0);

  const bumpTexture = new THREE.CanvasTexture(canvas);

  bumpTexture.wrapS = THREE.RepeatWrapping;
  bumpTexture.wrapT = THREE.RepeatWrapping;
  bumpTexture.repeat.set(3, 3);

  brainMaterial.bumpMap = bumpTexture;

  // HEMISFERIO IZQUIERDO

  const leftGeometry =
    new THREE.SphereGeometry(0.4, 48, 40);

  leftGeometry.scale(1.35, 1, 1.65);

  const leftHemisphere =
    new THREE.Mesh(leftGeometry, brainMaterial);

  leftHemisphere.position.x = -0.2;
  brainGroup.add(leftHemisphere);

  // HEMISFERIO DERECHO

  const rightHemisphere =
    new THREE.Mesh(leftGeometry.clone(), brainMaterial);

  rightHemisphere.position.x = 0.2;
  brainGroup.add(rightHemisphere);

  // TRONCO ENCEFÁLICO

  const stemGeometry =
    new THREE.CylinderGeometry(0.105, 0.15, 0.55, 24);

  const stemMaterial =
    new THREE.MeshStandardMaterial({
      color: 0xd98b9b,
      roughness: 0.55
    });

  const stem = new THREE.Mesh(
    stemGeometry,
    stemMaterial
  );

  stem.position.set(0, -0.39, -0.18);
  stem.rotation.x = 0.18;

  brainGroup.add(stem);

  // CEREBELO

  const cerebellum = new THREE.Mesh(
    new THREE.SphereGeometry(0.22, 32, 24),
    new THREE.MeshStandardMaterial({
      color: 0xd88d9d,
      roughness: 0.6
    })
  );

  cerebellum.scale.set(1.15, 0.7, 0.8);
  cerebellum.position.set(0, -0.27, -0.42);

  brainGroup.add(cerebellum);

  // POSICIÓN SOBRE EL MARCADOR

  brainGroup.position.y = 0.48;
  brainGroup.scale.setScalar(0.8);

  markerRoot.add(brainGroup);

  // ROTACIÓN TÁCTIL

  let dragging = false;
  let lastX = 0;
  let lastY = 0;

  renderer.domElement.addEventListener(
    "pointerdown", (event) => {
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
    }
  );

  window.addEventListener("pointermove", (event) => {

    if (!dragging) return;

    brainGroup.rotation.y +=
      (event.clientX - lastX) * 0.01;

    brainGroup.rotation.x +=
      (event.clientY - lastY) * 0.01;

    lastX = event.clientX;
    lastY = event.clientY;
  });

  window.addEventListener("pointerup", () => {
    dragging = false;
  });

  // ANIMACIÓN

  function animate() {

    requestAnimationFrame(animate);

    if (arSource.ready) {
      arContext.update(arSource.domElement);
    }

    if (!dragging) {
      brainGroup.rotation.y += 0.003;
    }

    renderer.render(scene, camera);
  }

  animate();

})();
</script>

</body>
</html>
